<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 视口设置：适配移动端设备，保证页面在不同屏幕下正常缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部独立样式文件，实现结构与样式分离 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 居中卡片：承载名片的全部内容 -->
    <div class="card">
        <!-- 圆形头像 -->
        <div class="avatar">
            <!-- 头像默认使用首字母占位；此处可替换为 <img> 标签加真实头像图片 -->
            <span class="avatar-letter">张</span>
        </div>

        <!-- 姓名 -->
        <h1 class="name">张小明</h1>

        <!-- 职位 -->
        <p class="title">前端开发工程师</p>

        <!-- 联系方式 -->
        <div class="contact">
            <!-- 邮箱联系方式 -->
            <a href="mailto:zhangxm@example.com" class="contact-item">📧 zhangxm@example.com</a>
            <!-- 电话联系方式 -->
            <a href="tel:+8613800000000" class="contact-item">📞 138-0000-0000</a>
        </div>
    </div>
</body>
</html>
